<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weekend Exam Booster - Wegvervoer 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.26.0/dist/tabler-icons.min.css">
<style>
:root{
  --bg:#1c2636; --card:#1f2d42; --card2:#23344c;
  --blue:#1a8cff; --gold:#d4a520; --gold2:#e8bf45;
  --text:#eef1f5; --muted:#c2cdd8; --dim:#7f8da0;
  --border:#47586e; --bad:#e84040; --good:#46b48a;
  --r:0.75rem; --r-lg:1rem;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;justify-content:center}
#shell{width:100%;max-width:560px;min-height:100vh;background:var(--bg);position:relative;display:flex;flex-direction:column;padding:0 18px 90px}
h1,h2,h3,.font-d{font-family:'Outfit',sans-serif;font-weight:600}
.label{font-family:'Outfit',sans-serif;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);font-weight:600}
.muted{color:var(--muted)} .dim{color:var(--dim)}
a{color:var(--blue);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* top bar */
.topbar{display:flex;align-items:center;gap:12px;padding:20px 2px 16px;position:sticky;top:0;background:linear-gradient(var(--bg) 80%,transparent);z-index:20}
.topbar .mark{width:40px;height:40px;flex:none}
.topbar .wm{font-family:'Outfit';font-weight:700;font-size:20px;letter-spacing:.3px}
.topbar .wm b{color:var(--gold);font-weight:700}
.topbar .sub{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:1px}
.back{margin-left:auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:18px;transition:.15s}
.back:hover{border-color:var(--gold);color:var(--gold)}

/* header art */
.headerart{border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin:4px 0 18px;background:var(--card)}
.headerart svg{display:block;width:100%;height:auto}

/* cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);transition:.15s}
.row{display:flex;align-items:center;gap:13px;padding:15px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);width:100%;text-align:left;transition:.15s;margin-bottom:10px}
.row:hover{border-color:var(--gold);background:var(--card2)}
.row .idx{font-family:'Outfit';color:var(--gold);font-size:15px;font-weight:600;width:30px;flex:none}
.row .ttl{flex:1;font-size:14.5px}
.row .meta{font-size:12px;color:var(--dim)}
.row .chev{color:var(--dim);font-size:18px}
.row .done{color:var(--good);font-size:18px}

/* hero */
.hero{display:flex;align-items:center;gap:18px;margin:0 0 18px;padding:20px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--card)}
.ring{width:78px;height:78px;flex:none}
.hero .h-t{font-family:'Outfit';font-size:20px;font-weight:600;line-height:1.25;margin-bottom:5px}
.hero .h-s{font-size:13px;color:var(--muted)}

.routebox{display:flex;gap:8px;margin:0 0 16px}
.routebox .step{flex:1;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 10px;text-align:center}
.routebox .step .d{font-family:'Outfit';font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:5px}
.routebox .step .w{font-size:12.5px;line-height:1.4;color:var(--text)}
.routebox .step.mid{border-color:var(--gold)}

.infonote{background:rgba(26,140,255,.10);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:16px;font-size:13px;line-height:1.55;color:var(--text)}
.formatbar{display:flex;gap:8px;margin:0 0 18px}
.formatbar .fb-item{flex:1;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:13px 10px;text-align:center}
.formatbar .fb-item .n{font-family:'Outfit';font-size:22px;font-weight:700;color:var(--gold);line-height:1}
.formatbar .fb-item .l{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.3}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 16px 16px;text-align:left;transition:.15s;display:flex;flex-direction:column;gap:10px;min-height:120px}
.tile:hover{border-color:var(--gold);transform:translateY(-2px)}
.tile .ic{font-size:24px;color:var(--gold)}
.tile .tl{font-family:'Outfit';font-size:16px;font-weight:600}
.tile .ts{font-size:12px;color:var(--muted);line-height:1.45}
.tile.wide{grid-column:1/3}
.tile .badge{display:inline-block;font-size:10px;letter-spacing:.04em;color:var(--good);border:1px solid rgba(70,180,138,.4);border-radius:6px;padding:2px 7px;margin-top:auto;align-self:flex-start}

/* section header */
.sec-title{display:flex;align-items:baseline;justify-content:space-between;margin:8px 2px 14px}
.sec-title .cnt{font-size:12px;color:var(--dim)}
.chap-head{margin:4px 0 16px}
.chap-head .n{font-family:'Outfit';font-size:38px;font-weight:300;color:var(--gold);line-height:1}
.chap-head h2{font-size:21px;margin-top:6px}
.chap-head .desc{font-size:13.5px;color:var(--muted);margin-top:6px;line-height:1.5}

/* quiz */
.q-meta{display:flex;justify-content:space-between;align-items:center;margin:6px 0 14px;font-size:12.5px;color:var(--muted)}
.qbar{height:5px;background:var(--card2);border-radius:3px;overflow:hidden;margin-bottom:20px}
.qbar i{display:block;height:100%;background:var(--gold);transition:.3s;width:0}
.q-txt{font-family:'Outfit';font-size:18px;font-weight:500;line-height:1.4;margin-bottom:20px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:15px 16px;margin-bottom:11px;font-size:14.5px;transition:.13s;line-height:1.45}
.opt:hover{border-color:var(--blue)}
.opt .ltr{display:inline-flex;width:24px;height:24px;border-radius:6px;background:var(--card2);color:var(--gold);font-family:'Outfit';font-weight:600;font-size:13px;align-items:center;justify-content:center;margin-right:11px;flex:none}
.opt.good{border-color:var(--good);background:rgba(70,180,138,.12)}
.opt.good .ltr{background:var(--good);color:#0c1a14}
.opt.bad{border-color:var(--bad);background:rgba(232,64,64,.12)}
.opt.bad .ltr{background:var(--bad);color:#fff}
.opt.dimmed{opacity:.5}
.opt.locked{cursor:default}
.timer{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:600}
.timer.warn{color:var(--bad)}
.qtype{display:inline-block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:2px 8px;margin-bottom:12px}
.fb{border-radius:var(--r);padding:14px 15px;margin:6px 0 16px;font-size:13.5px;line-height:1.6;border:1px solid var(--border)}
.fb.ok{border-color:rgba(70,180,138,.4);background:rgba(70,180,138,.07)}
.fb.no{border-color:rgba(232,64,64,.4);background:rgba(232,64,64,.07)}
.fb .h{font-family:'Outfit';font-weight:600;display:flex;align-items:center;gap:7px;margin-bottom:8px}
.fb.ok .h{color:var(--good)} .fb.no .h{color:var(--bad)}
.fb .sub-h{font-family:'Outfit';font-weight:600;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);margin:11px 0 4px;display:flex;align-items:center;gap:6px}
.fb .mistake .sub-h{color:var(--bad)}

/* primary button */
.pbtn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;background:var(--gold);color:#1a1407;font-family:'Outfit';font-weight:600;font-size:15px;border-radius:var(--r);padding:15px;transition:.15s;margin-top:6px}
.pbtn:hover{background:var(--gold2)}
.pbtn.blue{background:var(--blue);color:#fff}
.pbtn.blue:hover{filter:brightness(1.1)}
.pbtn.ghost{background:transparent;color:var(--gold);border:1px solid var(--border)}
.pbtn.ghost:hover{border-color:var(--gold);background:rgba(212,165,32,.07)}

/* exam result */
.score{text-align:center;padding:26px 0 18px}
.score .big{font-family:'Outfit';font-size:56px;font-weight:300;line-height:1}
.score .big b{font-weight:700;color:var(--gold)}
.score .verdict{font-family:'Outfit';font-size:21px;font-weight:600;margin-top:10px}
.score .verdict.pass{color:var(--good)} .score .verdict.fail{color:var(--bad)}
.score .sub{font-size:13.5px;color:var(--muted);margin-top:8px;line-height:1.55}
.blokrow{display:flex;align-items:center;gap:12px;padding:13px 15px;border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;background:var(--card)}
.blokrow .bn{flex:1;font-size:14px}
.blokrow .bs{font-family:'Outfit';font-weight:600;font-size:14px}
.blokrow .barwrap{width:90px;height:6px;background:var(--card2);border-radius:3px;overflow:hidden;flex:none}
.blokrow .barwrap i{display:block;height:100%;border-radius:3px}
.advies{background:rgba(212,165,32,.07);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:14px;font-size:13.5px;line-height:1.6}
.advies b{color:var(--text)}

/* coach */
.coach-card{padding:24px 20px;text-align:center}
.coach-card .av{width:64px;height:64px;border-radius:50%;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:var(--gold);font-size:28px;background:none;transition:.15s}
.coach-card h2{font-size:19px;margin-bottom:8px}
.coach-card p{font-size:13.5px;color:var(--muted);line-height:1.6;margin-bottom:6px}
.coachbtn{display:inline-flex;align-items:center;gap:7px;font-family:'Outfit';font-size:12.5px;font-weight:600;color:var(--gold);border:1px solid var(--border);border-radius:30px;padding:9px 15px;transition:.15s;margin:6px 0 2px}
.coachbtn:hover{border-color:var(--gold);background:rgba(212,165,32,.08)}
.coachbtn.off{opacity:.55}

/* leerstof */
.leadin{font-size:14px;color:var(--muted);line-height:1.6;margin:-2px 0 18px}
.lsec{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px 17px;margin-bottom:12px}
.lsec .lkop{font-family:'Outfit',sans-serif;font-size:15.5px;font-weight:600;color:var(--text);display:flex;align-items:flex-start;gap:9px;margin-bottom:9px;line-height:1.35}
.lsec .lkop .dot{color:var(--gold);font-size:8px;margin-top:7px;flex:none}
.lsec .ltxt{font-size:14px;color:var(--muted);line-height:1.65}
/* coach-knop onder het theorieblok (conversatiecoach, geen aparte voorlezer) */
.blokcoachbtn{display:inline-flex;align-items:center;gap:8px;font-family:'Outfit',sans-serif;font-size:13px;font-weight:600;color:var(--gold);border:1px solid var(--border);border-radius:30px;padding:11px 18px;margin:4px 0 6px;transition:.15s}
.blokcoachbtn:hover{border-color:var(--gold);background:rgba(212,165,32,.08)}
.blokcoachbtn i{font-size:16px}
.leerprogress{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim);margin:0 2px 14px}
.leerprogress .pill{font-family:'Outfit';font-size:11px;letter-spacing:.5px;color:var(--gold);border:1px solid var(--border);border-radius:20px;padding:3px 10px}
.fade{animation:f .25s ease}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.center-note{text-align:center;color:var(--muted);font-size:13px;padding:30px 0;line-height:1.6}
.pilltag{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--gold);border:1px solid var(--border);border-radius:20px;padding:4px 11px;font-family:'Outfit';font-weight:600}
.disc{background:rgba(232,64,64,.06);border:1px solid rgba(232,64,64,.3);border-radius:var(--r);padding:11px 13px;font-size:12.5px;color:var(--muted);line-height:1.55;margin-bottom:13px}
</style>
</head>
<body>
<div id="shell">
  <div class="topbar">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
      <rect x="4" y="26" width="36" height="20" rx="3" fill="none" stroke="#1a8cff" stroke-width="3"/>
      <path d="M40 30h11l7 9v7H40z" fill="none" stroke="#d4a520" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="18" cy="48" r="5" fill="none" stroke="#eef1f5" stroke-width="3"/>
      <circle cx="46" cy="48" r="5" fill="none" stroke="#eef1f5" stroke-width="3"/>
    </svg>
    <div>
      <div class="wm">SkillOps<b>AI</b></div>
      <div class="sub">Weekend Exam Booster</div>
    </div>
    <button class="back" id="backBtn" aria-label="terug" style="display:none" onclick="goBack()"><i class="ti ti-arrow-left"></i></button>
  </div>
  <div id="app"></div>
</div>

<script>
/* ====== CONTENT (geinjecteerd door build.py) ====== */
const CONTENT = {"examen": {"naam": "Weekend Exam Booster: Wegvervoer Goederen Deel 1", "format": "30 vragen / 60 min / min. 20 goed", "richting": "CBR-getuigschrift vakbekwaamheid, op weg naar NIWO-eurovergunning", "peildatum": "juni 2026", "feitenbasis": "BRON-Wegvervoer1-lesmateriaal-Chris.md (scope) + VERIFICATIE-Wegvervoer1-inhoud.md (geverifieerde actuele waarden, incl. aanvullende CEMT/tachograaf-sectie 16-06-2026)"}, "startcheck": [{"id": "SC01", "blok": "blok1_organisaties", "vraag": "Welke organisatie verleent in Nederland de eurovergunning voor het beroepsgoederenvervoer over de weg?", "opties": {"A": "NIWO", "B": "KIWA Register", "C": "RDW", "D": "CBR"}, "juist": "A", "uitleg": "De NIWO verleent, verlengt en trekt de eurovergunning en vergunningsbewijzen in. KIWA Register doet de vergunningen voor personenvervoer en taxi, de RDW gaat over voertuigregistratie en kentekens, en het CBR neemt de vakbekwaamheidsexamens af. Alleen de NIWO is de vergunningverlener voor goederenvervoer.", "examentip": "Onthoud de koppeling NIWO = goederenvervoer, KIWA = personenvervoer en taxi. Dat onderscheid wordt vaak getoetst.", "veelgemaakte_fout": "KIWA aanwijzen omdat het ook een vergunningverlener is, maar dan voor personenvervoer en niet voor goederen.", "bron": "NIWO productpagina vergunning wegvervoer; VERIFICATIE Blok 1 (KIWA-nuance) en BRON Blok 1"}, {"id": "SC02", "blok": "blok2_begrippen_overeenkomst", "vraag": "Wat is de maximale aansprakelijkheid van de vervoerder bij binnenlands wegvervoer onder de AVC 2002?", "opties": {"A": "8,33 SDR per kilogram", "B": "Maximaal 3,40 euro per kilogram", "C": "Onbeperkt", "D": "Maximaal 9,00 euro per kilogram"}, "juist": "B", "uitleg": "Onder de AVC 2002 is de vervoerder bij binnenlands wegvervoer aansprakelijk tot maximaal 3,40 euro per kilogram. De 8,33 SDR per kilogram hoort bij het internationale CMR-verdrag, niet bij de AVC. De aansprakelijkheid is dus juist wel begrensd en het bedrag van 9,00 euro bestaat niet als norm.", "examentip": "Koppel het bedrag aan het toepassingsgebied: 3,40 euro per kg is binnenland (AVC), 8,33 SDR per kg is internationaal (CMR).", "veelgemaakte_fout": "De CMR-norm (8,33 SDR per kg) toepassen op een binnenlandse rit.", "bron": "AVC 2002, art. aansprakelijkheid; VERIFICATIE Blok 2 (AVC 3,40/kg)"}, {"id": "SC03", "blok": "blok3_rij_en_rusttijden", "vraag": "Hoeveel uur mag een bestuurder volgens Verordening (EG) 561/2006 normaal gesproken maximaal per dag rijden?", "opties": {"A": "8 uur", "B": "10 uur", "C": "9 uur", "D": "11 uur"}, "juist": "C", "uitleg": "De normale dagelijkse rijtijd is maximaal 9 uur. Tweemaal per week mag deze worden verlengd tot 10 uur, maar dat is de uitzondering, niet de regel. De gevraagde normale maximumdagrijtijd is dus 9 uur.", "examentip": "Let op het woord normaal of normaliter in de vraag. Het standaardgetal is 9 uur, de 10 uur is de tweemaal-per-week-uitzondering.", "veelgemaakte_fout": "Direct 10 uur invullen omdat dat getal bekend is, terwijl naar de normale dagrijtijd wordt gevraagd.", "bron": "EU 561/2006 (dagelijkse rijtijd); VERIFICATIE Blok 3 (KLOPT)"}, {"id": "SC04", "blok": "blok4_cemt_grenzen", "vraag": "Bij hoeveel landen is de CEMT-vergunning volgens de actuele NIWO-lijn voor 2026 te gebruiken?", "opties": {"A": "27 landen", "B": "43 landen", "C": "50 landen", "D": "44 landen"}, "juist": "D", "uitleg": "De NIWO noemt voor 2026 expliciet 44 aangesloten landen. Het getal 27 is het aantal EU-lidstaten, niet CEMT-landen. Het getal 43 komt voor in oudere of ITF-bronnen, maar de actuele NIWO-lijn telt 44 namen. Het verschil komt doordat IJsland wel is aangesloten maar alleen meedoet met de CEMT-verhuisvergunning.", "examentip": "Houd voor het examen het NIWO-getal 44 aan. Verwar het niet met de 27 EU-lidstaten.", "veelgemaakte_fout": "27 invullen door CEMT te verwarren met de Europese Unie.", "bron": "NIWO CEMT-pagina en FAQ (44 landen); VERIFICATIE aanvullende sectie punt 4"}, {"id": "SC05", "blok": "blok2_begrippen_overeenkomst", "vraag": "In hoeveel originele exemplaren wordt de CMR-vrachtbrief opgemaakt?", "opties": {"A": "3 originelen", "B": "2 originelen", "C": "1 origineel", "D": "4 originelen"}, "juist": "A", "uitleg": "De CMR-vrachtbrief wordt opgemaakt in drie originele exemplaren: een voor de afzender, een die met de goederen meereist voor de geadresseerde, en een die de vervoerder houdt. De vrachtbrief geldt als bewijs van de vervoersovereenkomst. Een, twee of vier exemplaren is niet het verdragsmatige aantal.", "examentip": "Onthoud: drie originelen, drie betrokken partijen rond de zending.", "veelgemaakte_fout": "Twee exemplaren kiezen, alsof het alleen om afzender en vervoerder gaat, en de begeleidende kopie vergeten.", "bron": "CMR-verdrag (drie originelen, bewijsfunctie); VERIFICATIE Blok 2"}, {"id": "SC06", "blok": "blok3_rij_en_rusttijden", "vraag": "Na hoeveel uur rijden moet een bestuurder volgens Verordening (EG) 561/2006 uiterlijk een pauze van 45 minuten nemen?", "opties": {"A": "Na 4 uur", "B": "Na 4,5 uur", "C": "Na 5 uur", "D": "Na 6 uur"}, "juist": "B", "uitleg": "Na uiterlijk 4,5 uur rijden is een pauze van 45 minuten verplicht. Die pauze mag worden gesplitst in eerst 15 en daarna 30 minuten, in die volgorde. De andere getallen komen niet overeen met de verordening.", "examentip": "Onthoud de combinatie 4,5 uur rijden gevolgd door 45 minuten pauze, eventueel als 15 plus 30 in die volgorde.", "veelgemaakte_fout": "De splitvolgorde omdraaien naar 30 plus 15, of denken dat het na 5 uur is.", "bron": "EU 561/2006 (pauze); VERIFICATIE Blok 3 (KLOPT, split 15+30 in die volgorde)"}, {"id": "SC07", "blok": "blok1_organisaties", "vraag": "Wie handhaven specifiek de rij- en rusttijden op de weg?", "opties": {"A": "De NLA (Nederlandse Arbeidsinspectie)", "B": "De RDW en de douane", "C": "De ILT en de politie", "D": "Het CBR en de NIWO"}, "juist": "C", "uitleg": "De rij- en rusttijden op de weg worden gehandhaafd door de ILT en de politie. De NLA (Arbeidsinspectie) ziet vooral toe op de Arbeidstijdenwet en niet op de rij- en rusttijden op de weg. De RDW, douane, CBR en NIWO hebben hierin geen handhavingsrol op de weg.", "examentip": "Bij de vraag wie de rij- en rusttijden op de weg controleert is het antwoord altijd ILT plus politie, niet de NLA, ook al staat die in de bredere handhavingslijst.", "veelgemaakte_fout": "De NLA kiezen omdat die in de algemene handhavingslijst staat, terwijl die niet op de weg de rij- en rusttijden handhaaft.", "bron": "VERIFICATIE Blok 1 (handhaving rij-/rusttijden = ILT+politie; NLA = Arbeidstijdenwet) en afwijkingspunt 4"}, {"id": "SC08", "blok": "blok4_cemt_grenzen", "vraag": "In welke vorm bestaat de CEMT-vergunning sinds 1 januari 2026?", "opties": {"A": "Alleen als plastic pasje", "B": "Uitsluitend op papier", "C": "Zowel digitaal als op papier, naar keuze", "D": "Uitsluitend digitaal"}, "juist": "D", "uitleg": "Met ingang van 1 januari 2026 bestaat de CEMT-vergunning uitsluitend in digitale vorm. De papieren vergunning en het bijbehorende papieren groenbladige logboek zijn afgeschaft; in 2026 is ook het logboek digitaal. De andere vormen bestaan dus niet meer.", "examentip": "Let op de jaargrens 1 januari 2026: vanaf dan is de CEMT volledig digitaal, inclusief het logboek.", "veelgemaakte_fout": "Nog uitgaan van het papieren rittenboekje dat altijd in het voertuig moet liggen, terwijl dat sinds 2026 digitaal is.", "bron": "NIWO CEMT-pagina (digitale CEMT 2026); VERIFICATIE aanvullende sectie punt 2"}, {"id": "SC09", "blok": "blok2_begrippen_overeenkomst", "vraag": "Hoe heet het vervoer waarbij een buitenlandse vervoerder binnenlandse ritten uitvoert binnen een ander land?", "opties": {"A": "Transito", "B": "Grensoverschrijdend vervoer", "C": "Cabotage", "D": "Eigen vervoer"}, "juist": "C", "uitleg": "Cabotage is binnenlands vervoer dat een vervoerder uitvoert in een ander land dan het land van vestiging. Transito is doorvoer door een land zonder te laden of te lossen. Grensoverschrijdend vervoer gaat over de grens heen, en eigen vervoer is vervoer van eigen goederen voor de eigen onderneming.", "examentip": "Cabotage = binnenlandse rit in het buitenland. Transito = er alleen doorheen rijden. Verwar deze twee niet.", "veelgemaakte_fout": "Transito en cabotage door elkaar halen.", "bron": "BRON Blok 2 (begrippen cabotage/transito)"}, {"id": "SC10", "blok": "blok3_rij_en_rusttijden", "vraag": "Wat is de normale wekelijkse rust volgens Verordening (EG) 561/2006?", "opties": {"A": "Minimaal 45 uur", "B": "Minimaal 36 uur", "C": "Minimaal 24 uur", "D": "Minimaal 11 uur"}, "juist": "A", "uitleg": "De normale wekelijkse rust bedraagt minimaal 45 uur. Deze mag worden verkort tot minimaal 24 uur, mits de ingekorte uren als een blok worden gecompenseerd binnen drie weken. De 11 uur hoort bij de dagelijkse rust, niet bij de wekelijkse.", "examentip": "Onthoud het onderscheid: 45 uur normale weekrust, 24 uur verkorte weekrust, 11 uur dagelijkse rust.", "veelgemaakte_fout": "De 24 uur (verkorte weekrust) of de 11 uur (dagrust) verwarren met de normale weekrust van 45 uur.", "bron": "EU 561/2006 (wekelijkse rust); VERIFICATIE Blok 3 (KLOPT)"}], "blokken": {"blok1_organisaties": [{"id": "B1-01", "blok": "blok1_organisaties", "vraag": "Hoeveel CBR-examens moet een ondernemer halen om het getuigschrift van vakbekwaamheid voor het beroepsgoederenvervoer te behalen?", "opties": {"A": "6 examens", "B": "5 examens", "C": "3 examens", "D": "8 examens"}, "juist": "A", "uitleg": "Het getuigschrift van vakbekwaamheid wordt behaald door zes deelexamens bij het CBR te halen, binnen vijf jaar. De andere aantallen komen niet overeen met de examenstructuur.", "examentip": "Onthoud de combinatie zes examens binnen vijf jaar, beide getallen worden getoetst.", "veelgemaakte_fout": "Het getal 5 invullen door verwarring met de vijfjaarstermijn waarbinnen de examens moeten worden gehaald.", "bron": "CBR getuigschrift vakbekwaamheid (6 deelexamens binnen 5 jaar); VERIFICATIE Blok 1"}, {"id": "B1-02", "blok": "blok1_organisaties", "vraag": "Aan welke eis van risicodragend vermogen moet een onderneming voldoen voor het eerste voertuig bij de eurovergunning?", "opties": {"A": "5.000 euro", "B": "9.000 euro", "C": "14.000 euro", "D": "50.000 euro"}, "juist": "B", "uitleg": "Voor het eerste voertuig geldt een risicodragend vermogen van 9.000 euro. Voor elk volgend voertuig komt daar 5.000 euro bij. De 5.000 euro is dus het bedrag per volgend voertuig, niet voor het eerste.", "examentip": "Onthoud: 9.000 euro voor het eerste voertuig, 5.000 euro voor elk volgend voertuig.", "veelgemaakte_fout": "9.000 en 5.000 omdraaien of het bedrag per volgend voertuig op het eerste toepassen.", "bron": "NIWO financiele draagkracht (9.000 eerste, +5.000 per volgend); VERIFICATIE Blok 1"}, {"id": "B1-03", "blok": "blok1_organisaties", "vraag": "Met welke frequentie toetst de NIWO de eurovergunning van een onderneming?", "opties": {"A": "Elk jaar", "B": "Elke 3 jaar", "C": "Elke 5 jaar", "D": "Elke 10 jaar"}, "juist": "C", "uitleg": "De NIWO toetst de eurovergunning elke vijf jaar, bij de vijfjaarlijkse verlenging. De andere termijnen passen niet bij deze periodieke toetsing.", "examentip": "De vijfjaarstermijn komt op meerdere plekken terug: vakbekwaamheid binnen vijf jaar en de vijfjaarlijkse toetsing van de eurovergunning.", "veelgemaakte_fout": "Een jaarlijkse of driejaarlijkse toetsing aannemen.", "bron": "NIWO vijfjaarlijkse verlenging eurovergunning; VERIFICATIE Blok 1"}, {"id": "B1-04", "blok": "blok1_organisaties", "vraag": "Welke organisatie is de vergunningverlener voor het personenvervoer en taxivervoer, en daarmee niet voor het goederenvervoer?", "opties": {"A": "NIWO", "B": "Evofenedex", "C": "ILT", "D": "KIWA Register"}, "juist": "D", "uitleg": "KIWA Register verleent vergunningen voor personenvervoer en taxi. Voor het goederenvervoer is de NIWO de vergunningverlener. De ILT is een inspectiedienst en Evofenedex is een belangenorganisatie voor ondernemers, geen vergunningverlener.", "examentip": "Maak in je hoofd twee kolommen: goederen = NIWO, personen en taxi = KIWA.", "veelgemaakte_fout": "KIWA aan het goederenvervoer koppelen.", "bron": "VERIFICATIE Blok 1 (KIWA = personenvervoer/taxi); BRON Blok 1"}, {"id": "B1-05", "blok": "blok1_organisaties", "vraag": "Wat is het verschil tussen een ambassade en een consulaat?", "opties": {"A": "Een ambassade zit in de hoofdstad, een consulaat is een bijkantoor", "B": "Een ambassade is een bijkantoor, een consulaat zit in de hoofdstad", "C": "Een ambassade verleent vergunningen, een consulaat int belastingen", "D": "Er is geen verschil, beide termen betekenen hetzelfde"}, "juist": "A", "uitleg": "De ambassade is de hoofdvertegenwoordiging van een land en zit in de hoofdstad, terwijl een consulaat een bijkantoor is in een andere stad. Beide kunnen helpen met visa, legalisatie en bijstand bij beslag of calamiteiten. De overige beschrijvingen kloppen niet.", "examentip": "Onthoud: ambassade in de hoofdstad, consulaat als bijkantoor elders.", "veelgemaakte_fout": "De rollen van ambassade en consulaat omdraaien.", "bron": "BRON Blok 1 en VERIFICATIE Blok 1 (ambassade=hoofdstad, consulaat=bijkantoor)"}, {"id": "B1-06", "blok": "blok1_organisaties", "vraag": "Welke van de volgende documenten verstrekt de NIWO?", "opties": {"A": "Het rijbewijs", "B": "De CEMT-vergunning", "C": "Het kentekenbewijs", "D": "Het CBR-getuigschrift"}, "juist": "B", "uitleg": "De NIWO verstrekt onder meer de eurovergunning, ritmachtigingen, termijnmachtigingen, de CEMT-vergunning en het bestuurdersattest goederenvervoer. Het rijbewijs en kentekenbewijs lopen via andere instanties en het getuigschrift wordt door het CBR afgegeven.", "examentip": "Onthoud het rijtje NIWO-producten: eurovergunning, ritmachtiging, termijnmachtiging, CEMT en bestuurdersattest.", "veelgemaakte_fout": "Het CBR-getuigschrift aan de NIWO toeschrijven; dat geeft het CBR af.", "bron": "NIWO productpagina's (CEMT, ritmachtiging, bestuurdersattest); VERIFICATIE Blok 1"}, {"id": "B1-07", "blok": "blok1_organisaties", "vraag": "Welke twee partijen handhaven samen de rij- en rusttijden op de weg?", "opties": {"A": "RDW en Belastingdienst", "B": "NLA en douane", "C": "ILT en politie", "D": "NIWO en CBR"}, "juist": "C", "uitleg": "De rij- en rusttijden op de weg worden gehandhaafd door de ILT en de politie. De NLA ziet toe op de Arbeidstijdenwet en niet op de rij- en rusttijden op de weg. De overige combinaties hebben geen handhavingsrol voor de rij- en rusttijden.", "examentip": "Bij rij- en rusttijden op de weg: altijd ILT plus politie. De NLA hoort bij de Arbeidstijdenwet.", "veelgemaakte_fout": "De NLA aanwijzen omdat die in de brede handhavingslijst voorkomt.", "bron": "VERIFICATIE Blok 1 (ILT+politie) en afwijkingspunt 4"}], "blok2_begrippen_overeenkomst": [{"id": "B2-01", "blok": "blok2_begrippen_overeenkomst", "vraag": "Wat is de maximale aansprakelijkheid van de vervoerder per ontbrekende kilogram brutogewicht onder het internationale CMR-verdrag?", "opties": {"A": "8,33 SDR per kilogram", "B": "3,40 euro per kilogram", "C": "25 SDR per kilogram", "D": "Onbeperkt"}, "juist": "A", "uitleg": "Onder het CMR-verdrag is de vervoerder aansprakelijk tot maximaal 8,33 SDR per ontbrekende kilogram brutogewicht. De 3,40 euro per kilogram hoort bij de binnenlandse AVC 2002. De andere opties komen niet overeen met het verdrag.", "examentip": "Internationaal in SDR (8,33), binnenland in euro (3,40). Let op de eenheid in de vraag.", "veelgemaakte_fout": "De binnenlandse AVC-norm (3,40 euro) toepassen op een internationale rit.", "bron": "CMR-verdrag art. 23; VERIFICATIE Blok 2 (8,33 SDR/kg)"}, {"id": "B2-02", "blok": "blok2_begrippen_overeenkomst", "vraag": "Wat is de verjaringstermijn bij een vordering onder het CMR-verdrag in normale gevallen?", "opties": {"A": "6 maanden", "B": "1 jaar", "C": "3 jaar", "D": "5 jaar"}, "juist": "B", "uitleg": "De verjaringstermijn onder het CMR-verdrag is normaal gesproken een jaar. Alleen bij opzet of bewuste roekeloosheid wordt dat drie jaar. Zes maanden en vijf jaar passen niet bij het verdrag.", "examentip": "Onthoud: een jaar normaal, drie jaar bij opzet of bewuste roekeloosheid.", "veelgemaakte_fout": "Direct drie jaar invullen, terwijl dat alleen bij opzet of bewuste roekeloosheid geldt.", "bron": "CMR-verdrag art. 32; VERIFICATIE Blok 2 (1 jaar, 3 bij opzet)"}, {"id": "B2-03", "blok": "blok2_begrippen_overeenkomst", "vraag": "Binnen welke termijn moet schade volgens de AVC 2002 uiterlijk worden gemeld na aflevering?", "opties": {"A": "Binnen 24 uur", "B": "Binnen 14 dagen", "C": "Binnen 7 dagen", "D": "Binnen 1 maand"}, "juist": "C", "uitleg": "Onder de AVC 2002 moet schade uiterlijk binnen zeven dagen na aflevering worden gemeld. De andere termijnen komen niet overeen met de AVC.", "examentip": "Onthoud het getal zeven dagen voor de schademelding onder de AVC.", "veelgemaakte_fout": "Een termijn van 24 uur of 14 dagen aannemen.", "bron": "AVC 2002 (schademelding 7 dagen); VERIFICATIE Blok 2"}, {"id": "B2-04", "blok": "blok2_begrippen_overeenkomst", "vraag": "Welke verdragsregeling geldt bij internationaal wegvervoer van goederen tussen verdragslanden?", "opties": {"A": "De AVC 2002", "B": "Het ATA-carnet", "C": "De Wet wegvervoer goederen", "D": "Het CMR-verdrag"}, "juist": "D", "uitleg": "Bij internationaal wegvervoer geldt het CMR-verdrag. De AVC 2002 geldt voor binnenlands vervoer, mits overeengekomen. De Wet wegvervoer goederen regelt de toegang tot de markt en het ATA-carnet is een douanedocument voor tijdelijke invoer, geen vervoersovereenkomst.", "examentip": "Internationaal = CMR, binnenland = AVC. Een carnet is een douanedocument, geen overeenkomst.", "veelgemaakte_fout": "De AVC kiezen voor een internationale rit, of een douanedocument verwarren met de vervoersovereenkomst.", "bron": "VERIFICATIE Blok 2 (CMR internationaal, AVC binnenland); BRON Blok 2 en 4"}, {"id": "B2-05", "blok": "blok2_begrippen_overeenkomst", "vraag": "Wat is het verschil tussen beroepsvervoer en eigen vervoer?", "opties": {"A": "Bij beroepsvervoer worden goederen van derden tegen betaling vervoerd, bij eigen vervoer eigen goederen voor de eigen onderneming", "B": "Beroepsvervoer is altijd internationaal, eigen vervoer altijd binnenlands", "C": "Eigen vervoer vereist een eurovergunning, beroepsvervoer niet", "D": "Er is geen juridisch verschil tussen beide"}, "juist": "A", "uitleg": "Bij beroepsvervoer worden goederen van derden tegen betaling vervoerd; bij eigen vervoer vervoert een onderneming haar eigen goederen voor de eigen bedrijfsvoering. Het onderscheid hangt niet af van binnenland of internationaal. De eurovergunning is juist nodig voor beroepsvervoer, niet andersom.", "examentip": "De kern is voor wie en waarom je vervoert: goederen van derden tegen betaling (beroeps) of eigen goederen voor de eigen zaak (eigen vervoer).", "veelgemaakte_fout": "Het verschil koppelen aan binnenland versus buitenland in plaats van aan de aard van de lading en de tegenprestatie.", "bron": "BRON Blok 2 (beroepsvervoer vs eigen vervoer)"}, {"id": "B2-06", "blok": "blok2_begrippen_overeenkomst", "vraag": "Welk document moet zich in elk voertuig bevinden dat onder de eurovergunning rijdt?", "opties": {"A": "De originele eurovergunning", "B": "Het getuigschrift van vakbekwaamheid", "C": "Een gewaarmerkt vergunningsbewijs", "D": "Het kentekenbewijs deel 1"}, "juist": "C", "uitleg": "In elk voertuig dat onder de eurovergunning rijdt moet een gewaarmerkt vergunningsbewijs aanwezig zijn. De originele eurovergunning blijft bij de onderneming. Het getuigschrift hoort bij de vervoersmanager en is geen voertuigdocument, en het kentekenbewijs is een andere verplichting.", "examentip": "Onthoud: de eurovergunning blijft op kantoor, het vergunningsbewijs gaat mee in elk voertuig.", "veelgemaakte_fout": "Denken dat de originele eurovergunning in het voertuig moet liggen.", "bron": "BRON Blok 2 (vergunningsbewijs in elk voertuig)"}], "blok3_rij_en_rusttijden": [{"id": "B3-01", "blok": "blok3_rij_en_rusttijden", "vraag": "Hoeveel uur mag een bestuurder maximaal in twee opeenvolgende weken rijden volgens Verordening (EG) 561/2006?", "opties": {"A": "90 uur", "B": "80 uur", "C": "56 uur", "D": "112 uur"}, "juist": "A", "uitleg": "Over twee opeenvolgende weken mag een bestuurder maximaal 90 uur rijden. Per losse week is de maximale rijtijd 56 uur. De 56 uur slaat dus op een week, niet op twee weken, en de andere getallen passen niet bij de verordening.", "examentip": "Combineer de twee plafonds: 56 uur per week, maar samen niet meer dan 90 uur over twee weken.", "veelgemaakte_fout": "De 56 uur per week verdubbelen tot 112 uur, terwijl het tweewekenplafond 90 uur is.", "bron": "EU 561/2006 (wekelijkse rijtijd 56u, twee weken 90u); VERIFICATIE Blok 3"}, {"id": "B3-02", "blok": "blok3_rij_en_rusttijden", "vraag": "Tot hoeveel uur mag de normale dagelijkse rust van 11 uur worden verkort, en hoe vaak?", "opties": {"A": "Tot 10 uur, onbeperkt", "B": "Tot 9 uur, maximaal 3 keer tussen twee weekrusten", "C": "Tot 8 uur, maximaal 2 keer per week", "D": "Tot 9 uur, onbeperkt"}, "juist": "B", "uitleg": "De normale dagelijkse rust van 11 uur mag worden verkort tot 9 uur, maximaal driemaal tussen twee weekrusten. De rust mag ook worden gesplitst in 3 plus 9 uur. De andere combinaties van duur en frequentie kloppen niet.", "examentip": "Onthoud het paar 9 uur en driemaal. Een verkorte dagrust is dus niet onbeperkt toegestaan.", "veelgemaakte_fout": "Aannemen dat de verkorte dagrust onbeperkt mag, terwijl het maximaal driemaal tussen twee weekrusten is.", "bron": "EU 561/2006 (dagelijkse rust verkort tot 9u, max 3x); VERIFICATIE Blok 3"}, {"id": "B3-03", "blok": "blok3_rij_en_rusttijden", "vraag": "REKENVRAAG. Een bestuurder is op een dag al twee keer eerder die week 10 uur gereden. Vandaag heeft hij na 4,5 uur rijden zijn pauze van 45 minuten genomen. Hoeveel uur mag hij vandaag in totaal nog rijden nadat hij in totaal al 4,5 uur heeft gereden?", "opties": {"A": "Nog 6,5 uur, tot een dagtotaal van 11 uur", "B": "Nog 5,5 uur, tot een dagtotaal van 10 uur", "C": "Nog 4,5 uur, tot een dagtotaal van 9 uur", "D": "Nog 3,5 uur, tot een dagtotaal van 8 uur"}, "juist": "C", "uitleg": "De bestuurder heeft deze week al twee keer 10 uur gereden, dus de twee verlengingen tot 10 uur zijn op. Vandaag geldt daarom de normale dagrijtijd van 9 uur. Hij heeft al 4,5 uur gereden, dus mag hij nog 9 min 4,5 is 4,5 uur rijden. De opties met 10 of 11 uur dagtotaal kunnen niet, omdat de extra uren al gebruikt zijn.", "examentip": "Tel eerst hoeveel keer de 10-uursverlenging deze week al is gebruikt. Bij twee keer val je terug op de normale 9 uur.", "veelgemaakte_fout": "Toch 10 uur als dagmaximum aanhouden, terwijl de twee toegestane verlengingen die week al verbruikt zijn.", "bron": "EU 561/2006 (dagrijtijd 9u, 2x per week 10u); VERIFICATIE Blok 3"}, {"id": "B3-04", "blok": "blok3_rij_en_rusttijden", "vraag": "REKENVRAAG. Een bestuurder verkort deze week zijn wekelijkse rust van 45 uur tot 30 uur. Hoeveel uur moet hij als compensatie inhalen, en binnen welke termijn?", "opties": {"A": "45 uur, in te halen binnen 6 weken", "B": "21 uur, in te halen binnen 1 week", "C": "Geen compensatie, want 30 uur is toegestaan", "D": "15 uur, in te halen als blok binnen 3 weken"}, "juist": "D", "uitleg": "Het verschil tussen de normale weekrust van 45 uur en de genomen 30 uur is 15 uur. Die 15 uur moet als een aaneengesloten blok worden gecompenseerd binnen drie weken, gekoppeld aan een rust van minstens 9 uur. Er is dus wel degelijk compensatie nodig en het verschil bedraagt 15 uur, niet 21 of 45.", "examentip": "Reken het tekort uit als 45 min de genomen weekrust. Dat tekort haal je als blok in binnen drie weken.", "veelgemaakte_fout": "Denken dat 30 uur weekrust zonder meer mag en de compensatie vergeten, of het tekort verkeerd berekenen.", "bron": "EU 561/2006 (weekrust 45u, verkort 24u, compensatie als blok binnen 3 weken); VERIFICATIE Blok 3"}, {"id": "B3-05", "blok": "blok3_rij_en_rusttijden", "vraag": "Vanaf welke toegestane maximummassa is een tachograaf in beginsel verplicht voor nationaal goederenvervoer?", "opties": {"A": "Boven 3.500 kg", "B": "Boven 2.500 kg", "C": "Boven 7.500 kg", "D": "Boven 12.000 kg"}, "juist": "A", "uitleg": "Voor nationaal goederenvervoer geldt de tachograafplicht in beginsel bij een toegestane maximummassa boven 3.500 kg. De grens van 2.500 kg geldt vanaf 1 juli 2026 alleen voor internationaal vervoer, niet nationaal. De hogere getallen zijn niet de algemene grens.", "examentip": "Houd voor nationaal vervoer de grens van 3.500 kg aan. De 2.500 kg is een aparte, smallere regel voor internationaal vervoer.", "veelgemaakte_fout": "De 2.500 kg-grens, die alleen internationaal en vanaf 1 juli 2026 geldt, toepassen op nationaal vervoer.", "bron": "Rijksoverheid slimme tachograaf (3.500 kg nationaal); VERIFICATIE aanvullende sectie punt 3"}, {"id": "B3-06", "blok": "blok3_rij_en_rusttijden", "vraag": "Vanaf welke datum en vanaf welk gewicht geldt de slimme tachograaf versie 2 bij internationaal goederenvervoer?", "opties": {"A": "Vanaf 1 januari 2026, vanaf 3.500 kg", "B": "Vanaf 1 juli 2026, vanaf 7.500 kg", "C": "Vanaf 1 januari 2025, vanaf 2.500 kg", "D": "Vanaf 1 juli 2026, vanaf 2.500 kg"}, "juist": "D", "uitleg": "Vanaf 1 juli 2026 moeten voertuigen en voertuigcombinaties vanaf 2.500 kg toegestane maximummassa bij internationaal goederenvervoer zijn uitgerust met een slimme tachograaf versie 2. Voor nationaal vervoer blijft de grens 3.500 kg. De andere combinaties van datum en gewicht kloppen niet.", "examentip": "Knoop datum en gewicht aan elkaar: 1 juli 2026 en 2.500 kg, en alleen voor internationaal vervoer.", "veelgemaakte_fout": "De internationale 2.500 kg-grens verwarren met de nationale grens van 3.500 kg, of de datum verkeerd onthouden.", "bron": "Ondernemersplein/Rijksoverheid (smart tacho 2, 2.500 kg, 1-7-2026, internationaal); VERIFICATIE aanvullende sectie punt 3", "twijfel": true}], "blok4_cemt_grenzen": [{"id": "B4-01", "blok": "blok4_cemt_grenzen", "vraag": "Voor welke periode is een CEMT-vergunning geldig?", "opties": {"A": "Voor een kalenderjaar", "B": "Voor een enkele rit", "C": "Voor drie jaar", "D": "Voor vijf jaar"}, "juist": "A", "uitleg": "De CEMT-vergunning is geldig voor een kalenderjaar. Voor een enkele rit naar of door een niet-EU-land bestaat de ritmachtiging. De termijnen van drie of vijf jaar passen niet bij de CEMT.", "examentip": "CEMT is multilateraal en geldt een kalenderjaar. Verwar dat niet met de ritmachtiging voor een enkele rit.", "veelgemaakte_fout": "De CEMT verwarren met de ritmachtiging die voor een enkele rit geldt.", "bron": "NIWO CEMT-pagina (1 kalenderjaar); VERIFICATIE Blok 4"}, {"id": "B4-02", "blok": "blok4_cemt_grenzen", "vraag": "Aan welke voertuigeisen moet een voertuig voldoen om met een Nederlandse CEMT-vergunning te mogen rijden, zoals de NIWO die actueel formuleert?", "opties": {"A": "Aan de Euro1-norm", "B": "Aan de safe-normen: Euro5-safe, EEV-safe of Euro6-safe", "C": "Aan een willekeurige dieselnorm zonder eisen", "D": "Aan de elektrische-aandrijvingsplicht"}, "juist": "B", "uitleg": "De NIWO drukt de CEMT-voertuigeisen uit in de safe-categorieen: het voertuig moet voldoen aan Euro5-safe, EEV-safe of Euro6-safe normen voor geluid, uitstoot en veiligheid. Er is dus geen kale Euro-klasse zoals Euro1, en er geldt geen algemene elektrische plicht. Zonder eisen rijden mag niet.", "examentip": "Onthoud de safe-terminologie: Euro5-safe, EEV-safe en Euro6-safe. De oudere aanduiding EURO V plus is een vereenvoudiging.", "veelgemaakte_fout": "Uitgaan van een kale EURO V-aanduiding terwijl de NIWO de safe-normen hanteert.", "bron": "NIWO CEMT-pagina (voertuigeisen Euro5-safe/EEV-safe/Euro6-safe); VERIFICATIE aanvullende sectie punt 1"}, {"id": "B4-03", "blok": "blok4_cemt_grenzen", "vraag": "Mag de CEMT-vergunning worden gebruikt voor cabotage?", "opties": {"A": "Ja, cabotage is juist het hoofddoel van de CEMT", "B": "Ja, maar alleen binnen de EU", "C": "Nee, de CEMT geldt niet voor cabotage", "D": "Ja, maar alleen buiten de EU"}, "juist": "C", "uitleg": "De CEMT-vergunning geldt niet voor cabotage, dus niet voor binnenlands vervoer binnen een ander land. Ze is bedoeld voor multilateraal grensoverschrijdend vervoer tussen de aangesloten landen. De andere opties kloppen daarom niet.", "examentip": "Onthoud de uitsluiting: CEMT is voor grensoverschrijdend vervoer, niet voor cabotage.", "veelgemaakte_fout": "Aannemen dat de CEMT ook binnenlandse ritten in het buitenland dekt.", "bron": "NIWO CEMT-pagina; VERIFICATIE Blok 4 (CEMT niet voor cabotage)"}, {"id": "B4-04", "blok": "blok4_cemt_grenzen", "vraag": "In hoeveel CEMT-landen mag volgens de drielandenregeling per rit worden beladen?", "opties": {"A": "In maximaal 2 landen", "B": "In onbeperkt veel landen", "C": "In maximaal 4 landen", "D": "In maximaal 3 landen"}, "juist": "D", "uitleg": "Volgens de drielandenregeling mag per rit in maximaal drie CEMT-landen worden beladen. De andere aantallen komen niet overeen met deze regeling.", "examentip": "De naam zegt het al: drielandenregeling betekent beladen in maximaal drie landen per rit.", "veelgemaakte_fout": "Het aantal verwarren met twee of vier landen.", "bron": "VERIFICATIE Blok 4 (drielandenverkeer, max 3 landen per rit)"}, {"id": "B4-05", "blok": "blok4_cemt_grenzen", "vraag": "Welk document is sinds 2026 bij de CEMT-vergunning volledig digitaal in plaats van op papier?", "opties": {"A": "Het groenbladige logboek (rittenboekje)", "B": "Het CMR-vrachtbriefformulier", "C": "Het kentekenbewijs", "D": "Het bestuurdersattest"}, "juist": "A", "uitleg": "Sinds 1 januari 2026 bestaat de CEMT-vergunning uitsluitend digitaal en is ook het bijbehorende groenbladige papieren logboek afgeschaft. In 2026 is het logboek digitaal. De CMR-vrachtbrief, het kentekenbewijs en het bestuurdersattest zijn andere documenten met een eigen regeling.", "examentip": "Koppel de digitalisering aan het CEMT-logboek. Het papieren groenbladige rittenboekje bestaat niet meer.", "veelgemaakte_fout": "Nog uitgaan van het papieren rittenboekje dat altijd in het voertuig moet liggen.", "bron": "NIWO CEMT-pagina (digitaal logboek 2026); VERIFICATIE aanvullende sectie punt 2"}, {"id": "B4-06", "blok": "blok4_cemt_grenzen", "vraag": "Welke documenten kunnen nodig zijn bij vervoer naar een land buiten de EU?", "opties": {"A": "Alleen een eurovergunning", "B": "Douaneformaliteiten zoals T1 of T2, Carnet TIR of een ATA-carnet", "C": "Alleen een CMR-vrachtbrief", "D": "Alleen een vergunningsbewijs"}, "juist": "B", "uitleg": "Bij vervoer naar een land buiten de EU kunnen douaneformaliteiten nodig zijn, zoals de douanevervoerdocumenten T1 of T2, een Carnet TIR of een ATA-carnet. Binnen de EU volstaat het vrij goederenverkeer met de communautaire vergunning en het vergunningsbewijs. Een enkele eurovergunning, vrachtbrief of vergunningsbewijs dekt de douaneformaliteiten niet.", "examentip": "Buiten de EU komt de douane in beeld: T1 of T2, Carnet TIR en ATA-carnet. Binnen de EU is sprake van vrij verkeer.", "veelgemaakte_fout": "Denken dat de eurovergunning alleen genoeg is voor vervoer buiten de EU.", "bron": "BRON Blok 4 en VERIFICATIE Blok 4 (T1/T2, Carnet TIR, ATA-carnet buiten EU)"}, {"id": "B4-07", "blok": "blok4_cemt_grenzen", "vraag": "Welke tolheffing hoort bij Duitsland?", "opties": {"A": "Telepass", "B": "Eurovignet", "C": "Peage", "D": "Maut"}, "juist": "D", "uitleg": "De Maut is de tolheffing in Duitsland. Telepass hoort bij Italie en peage bij Frankrijk. Het eurovignet is een gezamenlijk vignet voor een aantal landen en niet specifiek Duits.", "examentip": "Knoop de tol aan het land: Maut is Duitsland, Telepass is Italie, peage is Frankrijk.", "veelgemaakte_fout": "De tolnamen aan de verkeerde landen koppelen.", "bron": "BRON Blok 4 (tolheffingen: Maut DE, Telepass IT, peage FR)"}]}, "mini_examen": [{"id": "ME01", "blok": "blok1_organisaties", "vraag": "Welke organisatie verleent de eurovergunning voor het beroepsgoederenvervoer?", "opties": {"A": "NIWO", "B": "RDW", "C": "CBR", "D": "KIWA Register"}, "juist": "A", "uitleg": "De NIWO verleent de eurovergunning voor het goederenvervoer. Het CBR neemt de examens af, de RDW gaat over kentekens en KIWA Register doet het personenvervoer.", "examentip": "NIWO is de vaste vergunningverlener voor goederenvervoer.", "veelgemaakte_fout": "KIWA of CBR als vergunningverlener aanwijzen.", "bron": "NIWO productpagina; VERIFICATIE Blok 1"}, {"id": "ME02", "blok": "blok3_rij_en_rusttijden", "vraag": "Wat is de normale maximale dagelijkse rijtijd volgens Verordening (EG) 561/2006?", "opties": {"A": "8 uur", "B": "9 uur", "C": "10 uur", "D": "11 uur"}, "juist": "B", "uitleg": "De normale dagrijtijd is 9 uur, met tweemaal per week een verlenging tot 10 uur als uitzondering.", "examentip": "Standaard 9 uur, uitzondering 10 uur (tweemaal per week).", "veelgemaakte_fout": "10 uur als standaard nemen.", "bron": "EU 561/2006; VERIFICATIE Blok 3"}, {"id": "ME03", "blok": "blok4_cemt_grenzen", "vraag": "Hoeveel landen zijn er volgens de actuele NIWO-lijn voor 2026 aangesloten bij de CEMT?", "opties": {"A": "27 landen", "B": "40 landen", "C": "44 landen", "D": "60 landen"}, "juist": "C", "uitleg": "De NIWO noemt voor 2026 44 aangesloten landen. 27 is het aantal EU-lidstaten en de andere getallen kloppen niet.", "examentip": "Houd 44 aan, niet 27 (dat zijn de EU-lidstaten).", "veelgemaakte_fout": "27 invullen door verwarring met de EU.", "bron": "NIWO CEMT-pagina en FAQ; VERIFICATIE aanvullende sectie punt 4"}, {"id": "ME04", "blok": "blok2_begrippen_overeenkomst", "vraag": "Welke aansprakelijkheidsnorm geldt bij internationaal vervoer onder het CMR-verdrag?", "opties": {"A": "3,40 euro per kilogram", "B": "Onbeperkt", "C": "5,00 euro per kilogram", "D": "8,33 SDR per kilogram"}, "juist": "D", "uitleg": "Onder het CMR-verdrag geldt maximaal 8,33 SDR per kilogram. De 3,40 euro per kilogram hoort bij de binnenlandse AVC 2002.", "examentip": "SDR hoort bij CMR (internationaal), euro per kg bij AVC (binnenland).", "veelgemaakte_fout": "AVC-norm op een internationale rit toepassen.", "bron": "CMR art. 23; VERIFICATIE Blok 2"}, {"id": "ME05", "blok": "blok1_organisaties", "vraag": "Hoeveel deelexamens bij het CBR zijn nodig voor het getuigschrift van vakbekwaamheid?", "opties": {"A": "6", "B": "5", "C": "4", "D": "7"}, "juist": "A", "uitleg": "Het getuigschrift wordt behaald met zes deelexamens binnen vijf jaar.", "examentip": "Zes examens binnen vijf jaar.", "veelgemaakte_fout": "5 invullen door verwarring met de vijfjaarstermijn.", "bron": "CBR getuigschrift; VERIFICATIE Blok 1"}, {"id": "ME06", "blok": "blok3_rij_en_rusttijden", "vraag": "Na hoeveel uur rijden is een pauze van 45 minuten verplicht?", "opties": {"A": "Na 3,5 uur", "B": "Na 4,5 uur", "C": "Na 4 uur", "D": "Na 5,5 uur"}, "juist": "B", "uitleg": "Na uiterlijk 4,5 uur rijden volgt een pauze van 45 minuten, eventueel gesplitst in 15 plus 30 minuten in die volgorde.", "examentip": "4,5 uur rijden, dan 45 minuten pauze.", "veelgemaakte_fout": "De pauze pas na 5 of 5,5 uur plannen.", "bron": "EU 561/2006; VERIFICATIE Blok 3"}, {"id": "ME07", "blok": "blok4_cemt_grenzen", "vraag": "Sinds wanneer bestaat de CEMT-vergunning uitsluitend in digitale vorm?", "opties": {"A": "Sinds 1 januari 2024", "B": "Sinds 1 januari 2025", "C": "Sinds 1 januari 2026", "D": "Sinds 1 juli 2026"}, "juist": "C", "uitleg": "Sinds 1 januari 2026 bestaat de CEMT-vergunning uitsluitend digitaal en is ook het papieren logboek afgeschaft.", "examentip": "Jaargrens 1 januari 2026 voor de volledig digitale CEMT.", "veelgemaakte_fout": "Nog uitgaan van een papieren CEMT of de datum verwarren met 1 juli 2026 (tachograaf).", "bron": "NIWO CEMT-pagina; VERIFICATIE aanvullende sectie punt 2"}, {"id": "ME08", "blok": "blok2_begrippen_overeenkomst", "vraag": "Wat is cabotage?", "opties": {"A": "Doorvoer door een land zonder laden of lossen", "B": "Internationaal vervoer tussen twee EU-landen", "C": "Het vervoeren van eigen goederen voor de eigen onderneming", "D": "Binnenlands vervoer dat een vervoerder uitvoert in een ander land"}, "juist": "D", "uitleg": "Cabotage is binnenlands vervoer dat door een buitenlandse vervoerder in een ander land wordt uitgevoerd. Doorvoer zonder laden of lossen heet transito.", "examentip": "Cabotage = binnenlandse rit in het buitenland.", "veelgemaakte_fout": "Cabotage verwarren met transito.", "bron": "BRON Blok 2"}, {"id": "ME09", "blok": "blok3_rij_en_rusttijden", "vraag": "Wie handhaven de rij- en rusttijden op de weg?", "opties": {"A": "ILT en politie", "B": "NLA en douane", "C": "RDW en CBR", "D": "NIWO en Belastingdienst"}, "juist": "A", "uitleg": "De ILT en de politie handhaven samen de rij- en rusttijden op de weg. De NLA ziet toe op de Arbeidstijdenwet, niet op de rij- en rusttijden op de weg.", "examentip": "Rij- en rusttijden op de weg: altijd ILT plus politie.", "veelgemaakte_fout": "De NLA aanwijzen als handhaver op de weg.", "bron": "VERIFICATIE Blok 1 en afwijkingspunt 4"}, {"id": "ME10", "blok": "blok4_cemt_grenzen", "vraag": "Aan welke voertuignormen moet volgens de NIWO worden voldaan voor de CEMT-vergunning?", "opties": {"A": "Euro1 of hoger", "B": "Euro5-safe, EEV-safe of Euro6-safe", "C": "Een vrije keuze zonder eisen", "D": "Uitsluitend elektrisch"}, "juist": "B", "uitleg": "De NIWO hanteert de safe-normen: Euro5-safe, EEV-safe of Euro6-safe. Er is geen kale Euro1-norm en geen algemene elektrische plicht.", "examentip": "Onthoud de safe-terminologie in plaats van een kale Euro-klasse.", "veelgemaakte_fout": "Een kale EURO V-norm aanhouden zonder de safe-toevoeging.", "bron": "NIWO CEMT-pagina (voertuigeisen); VERIFICATIE aanvullende sectie punt 1"}, {"id": "ME11", "blok": "blok2_begrippen_overeenkomst", "vraag": "Binnen welke termijn verjaart een vordering onder het CMR-verdrag in normale gevallen?", "opties": {"A": "6 maanden", "B": "2 jaar", "C": "1 jaar", "D": "3 jaar"}, "juist": "C", "uitleg": "De verjaringstermijn is normaal een jaar, en drie jaar bij opzet of bewuste roekeloosheid.", "examentip": "Een jaar normaal, drie jaar bij opzet.", "veelgemaakte_fout": "Direct drie jaar invullen.", "bron": "CMR art. 32; VERIFICATIE Blok 2"}, {"id": "ME12", "blok": "blok3_rij_en_rusttijden", "vraag": "Wat is de normale wekelijkse rust volgens Verordening (EG) 561/2006?", "opties": {"A": "Minimaal 24 uur", "B": "Minimaal 36 uur", "C": "Minimaal 56 uur", "D": "Minimaal 45 uur"}, "juist": "D", "uitleg": "De normale weekrust is minimaal 45 uur, verkort tot minimaal 24 uur met compensatie binnen drie weken.", "examentip": "45 uur normaal, 24 uur verkort.", "veelgemaakte_fout": "De verkorte 24 uur als normaal nemen.", "bron": "EU 561/2006; VERIFICATIE Blok 3"}, {"id": "ME13", "blok": "blok4_cemt_grenzen", "vraag": "Voor welke periode geldt een CEMT-vergunning?", "opties": {"A": "Een kalenderjaar", "B": "Een enkele rit", "C": "Twee jaar", "D": "Vijf jaar"}, "juist": "A", "uitleg": "De CEMT-vergunning is geldig voor een kalenderjaar. Voor een enkele rit bestaat de ritmachtiging.", "examentip": "CEMT geldt een kalenderjaar.", "veelgemaakte_fout": "De CEMT verwarren met de ritmachtiging voor een enkele rit.", "bron": "NIWO CEMT-pagina; VERIFICATIE Blok 4"}, {"id": "ME14", "blok": "blok2_begrippen_overeenkomst", "vraag": "Welk document moet aanwezig zijn in elk voertuig dat onder de eurovergunning rijdt?", "opties": {"A": "De originele eurovergunning", "B": "Een gewaarmerkt vergunningsbewijs", "C": "Het getuigschrift van vakbekwaamheid", "D": "De jaarrekening van de onderneming"}, "juist": "B", "uitleg": "In elk voertuig moet een gewaarmerkt vergunningsbewijs aanwezig zijn; de originele eurovergunning blijft bij de onderneming.", "examentip": "Vergunningsbewijs in het voertuig, eurovergunning op kantoor.", "veelgemaakte_fout": "De originele eurovergunning in het voertuig verwachten.", "bron": "BRON Blok 2"}, {"id": "ME15", "blok": "blok3_rij_en_rusttijden", "vraag": "REKENVRAAG. Een bestuurder heeft deze week al twee keer de dagrijtijd tot 10 uur verlengd. Wat is vandaag zijn maximale dagrijtijd?", "opties": {"A": "8 uur", "B": "10 uur", "C": "9 uur", "D": "11 uur"}, "juist": "C", "uitleg": "De twee toegestane verlengingen tot 10 uur zijn deze week op, dus vandaag geldt de normale dagrijtijd van 9 uur.", "examentip": "Tel hoe vaak de 10-uursverlenging al is gebruikt; bij twee keer val je terug op 9 uur.", "veelgemaakte_fout": "Toch 10 uur aanhouden terwijl de verlengingen al gebruikt zijn.", "bron": "EU 561/2006; VERIFICATIE Blok 3"}, {"id": "ME16", "blok": "blok1_organisaties", "vraag": "Welk risicodragend vermogen geldt voor elk volgend voertuig na het eerste bij de eurovergunning?", "opties": {"A": "9.000 euro", "B": "1.000 euro", "C": "3.400 euro", "D": "5.000 euro"}, "juist": "D", "uitleg": "Voor elk volgend voertuig na het eerste geldt 5.000 euro. Voor het eerste voertuig is dat 9.000 euro.", "examentip": "9.000 euro voor het eerste, 5.000 euro per volgend voertuig.", "veelgemaakte_fout": "De bedragen voor eerste en volgende voertuigen omdraaien.", "bron": "NIWO financiele draagkracht; VERIFICATIE Blok 1"}, {"id": "ME17", "blok": "blok4_cemt_grenzen", "vraag": "In hoeveel CEMT-landen mag per rit worden beladen volgens de drielandenregeling?", "opties": {"A": "3", "B": "2", "C": "4", "D": "5"}, "juist": "A", "uitleg": "Volgens de drielandenregeling mag per rit in maximaal drie CEMT-landen worden beladen.", "examentip": "De naam verklapt het antwoord: maximaal drie landen.", "veelgemaakte_fout": "Twee of vier landen invullen.", "bron": "VERIFICATIE Blok 4"}, {"id": "ME18", "blok": "blok2_begrippen_overeenkomst", "vraag": "Binnen welke termijn moet schade volgens de AVC 2002 worden gemeld?", "opties": {"A": "Binnen 14 dagen", "B": "Binnen 7 dagen", "C": "Binnen 30 dagen", "D": "Binnen 1 jaar"}, "juist": "B", "uitleg": "Onder de AVC 2002 moet schade uiterlijk binnen zeven dagen na aflevering worden gemeld.", "examentip": "AVC-schademelding: zeven dagen.", "veelgemaakte_fout": "Een langere termijn aannemen.", "bron": "AVC 2002; VERIFICATIE Blok 2"}, {"id": "ME19", "blok": "blok3_rij_en_rusttijden", "vraag": "Vanaf welke toegestane maximummassa geldt voor nationaal goederenvervoer in beginsel de tachograafplicht?", "opties": {"A": "Boven 2.500 kg", "B": "Boven 5.000 kg", "C": "Boven 3.500 kg", "D": "Boven 7.500 kg"}, "juist": "C", "uitleg": "Voor nationaal goederenvervoer geldt de tachograafplicht in beginsel boven 3.500 kg. De 2.500 kg-grens geldt vanaf 1 juli 2026 alleen internationaal.", "examentip": "Nationaal 3.500 kg, internationaal vanaf 1 juli 2026 al vanaf 2.500 kg.", "veelgemaakte_fout": "De internationale 2.500 kg-grens op nationaal vervoer toepassen.", "bron": "Rijksoverheid slimme tachograaf; VERIFICATIE aanvullende sectie punt 3"}, {"id": "ME20", "blok": "blok4_cemt_grenzen", "vraag": "Welke tolheffing hoort bij Frankrijk?", "opties": {"A": "Maut", "B": "Telepass", "C": "Eurovignet", "D": "Peage"}, "juist": "D", "uitleg": "De peage is de tolheffing in Frankrijk. Maut hoort bij Duitsland en Telepass bij Italie.", "examentip": "Peage is Frankrijk, Maut is Duitsland, Telepass is Italie.", "veelgemaakte_fout": "De tolnamen aan het verkeerde land koppelen.", "bron": "BRON Blok 4 (tolheffingen)"}]};

/* ====== LEERSTOF (geinjecteerd door build.py) ====== */
const LEERSTOF = {"meta": {"naam": "Leerstof Wegvervoer Goederen Deel 1", "doel": "Korte, gerichte studietekst per blok. Eerst leren, dan oefenen.", "peildatum": "juni 2026", "feitenbasis": "BRON-Wegvervoer1-lesmateriaal-Chris.md (scope) + VERIFICATIE-Wegvervoer1-inhoud.md (geverifieerde actuele waarden). Actueel wint van verouderd."}, "blok1_organisaties": {"titel": "Organisaties, ambassades en NIWO", "intro": "Dit blok gaat over wie wat doet in het wegvervoer. Welke organisatie geeft je vergunning af, wie controleert op de weg, en waar moet je aan voldoen om met je bedrijf de weg op te mogen. Ken de namen en hun rol, want dat is precies wat het examen toetst.", "secties": [{"kop": "NIWO: jouw vergunningverlener voor goederenvervoer", "tekst": "De NIWO is de instantie die in Nederland de eurovergunning verleent, verlengt en intrekt voor het beroepsgoederenvervoer over de weg. Naast de eurovergunning geeft de NIWO ook de vergunningsbewijzen af, plus ritmachtigingen, termijnmachtigingen, CEMT-vergunningen en het EU-bestuurdersattest. Onthoud dit als een vaste koppeling: goederenvervoer is NIWO. KIWA Register doet juist het personenvervoer en taxi, niet het goederenvervoer. Die twee niet door elkaar halen, dat onderscheid wordt vaak gevraagd.", "bron": "BRON Blok 1 + VERIFICATIE Blok 1 (NIWO-taken; KIWA = personenvervoer/taxi)"}, {"kop": "De eurovergunning: aan welke vier eisen moet je voldoen", "tekst": "Wil je beroepsgoederenvervoer doen, dan heb je een eurovergunning nodig. Daarvoor gelden vier eisen. Eén: betrouwbaarheid. Twee: financiele draagkracht, met een risicodragend vermogen van 9.000 euro voor het eerste voertuig en 5.000 euro voor elk volgend voertuig. Drie: vakbekwaamheid, die haal je met zes CBR-deelexamens binnen vijf jaar (samen het getuigschrift van vakbekwaamheid). Vier: een reele vestiging in Nederland. De NIWO toetst de vergunning daarna elke vijf jaar opnieuw. De vijfjaarstermijn komt dus dubbel terug: vakbekwaamheid binnen vijf jaar, en een vijfjaarlijkse toetsing van de vergunning.", "bron": "BRON Blok 1 + VERIFICATIE Blok 1 (9.000/5.000 euro; 6 examens binnen 5 jaar; vijfjaarlijkse verlenging)"}, {"kop": "Wie controleert op de weg", "tekst": "Er is een brede lijst handhavers: politie, ILT, NLA, Marechaussee, Douane en Belastingdienst. Voor het examen telt vooral dit: de rij- en rusttijden op de weg worden gehandhaafd door de ILT en de politie samen. De NLA (de Nederlandse Arbeidsinspectie) ziet toe op de Arbeidstijdenwet, niet op de rij- en rusttijden op de weg. Krijg je dus de vraag wie de rij- en rusttijden op de weg controleert, dan is het antwoord altijd ILT plus politie, ook al staat de NLA in de bredere lijst.", "bron": "VERIFICATIE Blok 1 (handhaving rij-/rusttijden = ILT+politie; NLA = Arbeidstijdenwet) en afwijkingspunt 4"}, {"kop": "De andere organisaties en hun rol", "tekst": "Naast de NIWO loop je nog een rij namen tegen het lijf. Werkgevers- en werknemersorganisaties: TLN, VERN en Evofenedex aan werkgeverskant, FNV en CNV aan werknemerskant. Verder de RDW (voertuigregistratie en kentekens), het CBR (neemt je vakbekwaamheidsexamens af), KIWA (personenvervoer en taxi), de Stichting Vervoeradres, de internationale koepels ITF en IRU, het LMA en het ministerie IenW. Onthoud per organisatie de kerntaak, want het examen vraagt graag welke partij ergens wel of niet over gaat.", "bron": "BRON Blok 1 (organisatielijst en taken)"}, {"kop": "Ambassade versus consulaat", "tekst": "Een ambassade is de hoofdvertegenwoordiging van een land en zit in de hoofdstad. Een consulaat is een bijkantoor in een andere stad. Beide kunnen je helpen met visa, met legalisatie van documenten en met bijstand bij beslag of een calamiteit onderweg. Het verschil zit dus in de plaats en de rang, niet in een totaal andere taak. Draai de twee niet om: ambassade is hoofdstad, consulaat is bijkantoor.", "bron": "BRON Blok 1 + VERIFICATIE Blok 1 (ambassade=hoofdstad, consulaat=bijkantoor; taken)"}]}, "blok2_begrippen_overeenkomst": {"titel": "Begrippen, vervoersovereenkomst en ritmachtigingen", "intro": "Dit blok draait om de taal van het vak en om de afspraken rond een rit. Wat betekenen de begrippen, welke documenten horen bij een transport, en hoe ver gaat de aansprakelijkheid als er iets misgaat. Het examen test vooral of je binnenland en buitenland uit elkaar houdt: andere regeling, andere getallen, andere eenheid.", "secties": [{"kop": "De kernbegrippen: soorten vervoer", "tekst": "Beroepsvervoer is het vervoeren van goederen van derden tegen betaling. Eigen vervoer is het vervoeren van je eigen goederen voor je eigen onderneming. Dat onderscheid hangt niet af van of je de grens over gaat, maar van voor wie en waarom je rijdt. Verder: binnenlands vervoer blijft in eigen land, grensoverschrijdend vervoer gaat de grens over. Cabotage is binnenlands vervoer dat een buitenlandse vervoerder in een ander land uitvoert. Transito is doorvoer door een land zonder te laden of te lossen. Cabotage en transito worden vaak verwisseld, dus zet ze scherp tegenover elkaar: cabotage is een binnenlandse rit in het buitenland, transito is er alleen doorheen rijden.", "bron": "BRON Blok 2 (beroeps/eigen vervoer, cabotage, transito)"}, {"kop": "De betrokken partijen en de documenten", "tekst": "Bij een transport heb je drie rollen: de vervoerder (die rijdt), de afzender (die de goederen aanbiedt) en de geadresseerde (die ze ontvangt). De CMR-vrachtbrief is het bewijs van de vervoersovereenkomst en wordt opgemaakt in drie originele exemplaren: een voor de afzender, een die met de goederen meereist voor de geadresseerde, en een voor de vervoerder. In elk voertuig dat onder de eurovergunning rijdt moet een gewaarmerkt vergunningsbewijs liggen. Let op: de originele eurovergunning blijft op kantoor bij de onderneming, alleen het vergunningsbewijs gaat mee in het voertuig.", "bron": "BRON Blok 2 + VERIFICATIE Blok 2 (CMR drie originelen, bewijsfunctie; vergunningsbewijs in voertuig)"}, {"kop": "AVC 2002: de binnenlandse regeling", "tekst": "Voor binnenlands wegvervoer in Nederland geldt de AVC 2002, mits die is overeengekomen. Daarbij is de vervoerder aansprakelijk tot maximaal 3,40 euro per kilogram. Schade moet je uiterlijk binnen zeven dagen na aflevering melden. Knoop het getal aan het land: binnenland is euro per kilogram (3,40), en de meldtermijn is zeven dagen.", "bron": "VERIFICATIE Blok 2 (AVC max 3,40/kg; schademelding binnen 7 dagen)"}, {"kop": "CMR-verdrag: de internationale regeling", "tekst": "Voor internationaal wegvervoer tussen verdragslanden geldt het CMR-verdrag. De aansprakelijkheid is daar maximaal 8,33 SDR per ontbrekende kilogram brutogewicht. De verjaringstermijn is in normale gevallen een jaar, en drie jaar bij opzet of bewuste roekeloosheid. Let op de eenheid: internationaal reken je in SDR (8,33), binnenland in euro (3,40 onder de AVC). Het examen verleidt je graag de binnenlandse norm op een internationale rit te plakken, of andersom.", "bron": "VERIFICATIE Blok 2 (CMR 8,33 SDR/kg; verjaring 1 jaar, 3 bij opzet)"}, {"kop": "Rit- en termijnmachtiging", "tekst": "Wil je rijden naar of door een land buiten de EU, dan kun je een machtiging nodig hebben. Een ritmachtiging geldt voor een enkele rit, met quota per land. Een termijnmachtiging geldt voor een langere periode en laat onbeperkt ritten in die periode toe. Beide vraag je aan via de NIWO. Verwar de ritmachtiging (een rit) niet met de CEMT-vergunning (een kalenderjaar, multilateraal), dat onderscheid komt in blok 4 terug.", "bron": "BRON Blok 2 (ritmachtiging vs termijnmachtiging, beide via NIWO)"}]}, "blok3_rij_en_rusttijden": {"titel": "Rij- en rusttijden (EU 561/2006)", "intro": "Dit blok is rekenwerk met vaste getallen, en het is het zwaarst getoetst. Verordening (EG) 561/2006 bepaalt hoe lang je mag rijden, wanneer je pauze moet nemen en hoeveel rust je nodig hebt. Leer de getallen uit je hoofd en let scherp op de woorden normaal, maximaal en uitzondering. Een week loopt van maandag 00.00 tot zondag 24.00.", "secties": [{"kop": "Rijtijden: per dag en per week", "tekst": "De normale dagelijkse rijtijd is maximaal 9 uur. Tweemaal per week mag je dat verlengen tot 10 uur, maar dat is de uitzondering, niet de regel. Per week mag je maximaal 56 uur rijden. Over twee opeenvolgende weken samen mag je niet boven de 90 uur uitkomen. Let op de val: 56 uur is per week, dus twee weken is geen 112 maar maximaal 90 uur. Tel bij rekenvragen eerst hoe vaak je deze week de 10-uursverlenging al hebt gebruikt. Zijn die twee keer op, dan val je terug op 9 uur.", "bron": "VERIFICATIE Blok 3 (dagrijtijd 9u/2x10u; weekrijtijd 56u; twee weken 90u; week = ma 00.00-zo 24.00)"}, {"kop": "Pauze: na 4,5 uur rijden", "tekst": "Na uiterlijk 4,5 uur rijden ben je verplicht een pauze van 45 minuten te nemen. Die pauze mag je splitsen in eerst 15 en daarna 30 minuten, in die volgorde. Let op de volgorde: het is 15 plus 30, niet 30 plus 15. Onthoud het paar: 4,5 uur rijden, dan 45 minuten pauze.", "bron": "VERIFICATIE Blok 3 (pauze 45 min na 4,5u; split 15+30 in die volgorde)"}, {"kop": "Dagelijkse rust", "tekst": "De normale dagelijkse rust is minimaal 11 uur per 24 uur. Je mag die verkorten tot 9 uur, maar maximaal driemaal tussen twee weekrusten. Je mag de dagrust ook splitsen in 3 plus 9 uur. Onthoud het paar 9 uur en driemaal: een verkorte dagrust is dus niet onbeperkt toegestaan.", "bron": "VERIFICATIE Blok 3 (dagrust min 11u, verkort 9u max 3x, split 3+9)"}, {"kop": "Wekelijkse rust", "tekst": "De normale wekelijkse rust is minimaal 45 uur. Je mag die verkorten tot minimaal 24 uur, maar dan moet je de ingekorte uren als een aaneengesloten blok compenseren binnen drie weken. Een weekrust moet uiterlijk na zes 24-uursperioden vallen. Reken bij compensatie het tekort uit als 45 min de genomen weekrust. Neem je bijvoorbeeld 30 uur, dan is het tekort 15 uur, in te halen als blok binnen drie weken. Houd de getallen uit elkaar: 45 uur normale weekrust, 24 uur verkorte weekrust, 11 uur dagrust.", "bron": "VERIFICATIE Blok 3 (weekrust min 45u, verkort 24u, compensatie als blok binnen 3 weken, uiterlijk na 6x24u)"}, {"kop": "Tachograaf en gewichtsgrenzen", "tekst": "Voor nationaal goederenvervoer is de tachograaf in beginsel verplicht boven een toegestane maximummassa van 3.500 kg. Per 1 juli 2026 komt daar een aparte, smallere regel bij: bij internationaal goederenvervoer moeten voertuigen en combinaties vanaf 2.500 kg een slimme tachograaf versie 2 hebben. Houd de twee grenzen uit elkaar: nationaal 3.500 kg, internationaal vanaf 1 juli 2026 al vanaf 2.500 kg. De bestuurderskaart is persoonlijk. Bij multi-manning (dubbele bemanning) reken je met een venster van 30 uur waarin elke bestuurder minstens 9 uur dagrust neemt, wat ruwweg neerkomt op zo'n 21 uur rijruimte (dat is een rekenregel, geen los wettelijk getal). Bij een veer- of treinreis mag de regelmatige dagrust maximaal tweemaal worden onderbroken, samen hooguit 1 uur.", "bron": "VERIFICATIE Blok 3 + aanvullende sectie punt 3 (tachograaf 3.500 nationaal / 2.500 internationaal per 1-7-2026; multi-manning 30u-venster met min 9u rust; veer/trein max 2x/1u)"}]}, "blok4_cemt_grenzen": {"titel": "CEMT, EU-grenzen en landendocumentatie", "intro": "Dit blok gaat over rijden over de grens. Binnen de EU geldt vrij verkeer, daarbuiten komt de douane in beeld. De CEMT-vergunning is een belangrijk onderwerp: leer wat hij wel en niet dekt. Het examen vraagt vaak wanneer je wel of geen CEMT nodig hebt, dus let op de details.", "secties": [{"kop": "Wat de CEMT-vergunning is", "tekst": "De CEMT-vergunning is een multilaterale vergunning, beheerd door het International Transport Forum (ITF). Je kunt ermee beroepsvervoer doen naar, van en door de 44 landen die bij de CEMT zijn aangesloten. De vergunning is geldig voor een kalenderjaar, kent een quotum en vraag je aan via de NIWO. Belangrijk: de CEMT geldt niet voor cabotage, dus niet voor binnenlands vervoer binnen een ander land. Verwar de CEMT (een kalenderja     id:q.id, blok:q.blok||blok, vraag:q.vraag, opties:opts, correct:correct,

    bron:q.bron||"", twijfel:!!q.twijfel

}

/* ====== helpers ====== */
function esc(s){return (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

/* opties husselen, maar correct-index meeschuiven; uitleg verwijst nooit naar letters */
function shuffleOpts(q){
  const order = shuffle(q.opties.map((_,i)=>i));
  return Object.assign({}, q, {
    opties: order.map(i=>q.opties[i]),
    correct: order.indexOf(q.correct)
  });
}

function render(){

  f(); window.scrollTo(0,0);
}
function go(fn){ stack.push(fn); render(); }
function goBack(){ stack.pop(); render(); }
function reset(fn){ stack=[fn]; render(); }

/* ====== gedeelde quiz-engine ====== */
let Q={};
function startQuiz(list, titel, opts){
  opts = opts||{};
  Q = {
    list: opts.shuffle===false ? list.slice() : shuffle(list).slice(0, opts.max||list.length),
    titel, i:0, answered:false, goed:0, fout:[], streak:0,
    mode: opts.mode||'oefen',           // 'oefen' = feedback per vraag; 'exam' = score aan eind
    onDone: opts.onDone||null,
    showFeedback: opts.mode!=='exam'    // mini-examen toont uitleg pas in het eindoverzicht
  };
  Q.list = Q.list.map(shuffleOpts);
  quizStep();
}
function quizStep(){
  const q=Q.list[Q.i];
  app.innerHTML = `
   <div class="q-meta"><span>${esc(Q.titel)}</span><span>${Q.i+1} / ${Q.list.length}${Q.mode==='exam'?'':` &middot; ${Q.goed} goed`}</span></div>
   <div class="qbar"><i style="width:${Q.i/Q.list.length*100}%"></i></div>
   <div class="qtype">Meerkeuze</div>
   ${q.twijfel?`<div class="disc"><i class="ti ti-info-circle"></i> Verdiepingsvraag. Dit punt ligt nog niet helemaal vast in de bronnen. Tel het niet zwaar mee, het is bedoeld om over na te denken.</div>`:''}
   <div class="q-txt">${esc(q.vraag)}</div>
   <div id="opts">${q.opties.map((o,k)=>`<button class="opt" onclick="answer(${k})"><span class="ltr">${LETTERS[k]}</span>${esc(o)}</button>`).join('')}</div>
   <div id="fbslot"></div>`;
}
function answer(k){
  if(Q.answered)return; Q.answered=true;
  const q=Q.list[Q.i], ok=(k===q.correct);
  if(ok){ Q.goed++; Q.streak++; } else { Q.streak=0; Q.fout.push(q); }
  document.querySelectorAll('#opts .opt').forEach((el,idx)=>{
    el.onclick=null; el.classList.add('locked','dimmed');
    if(idx===q.correct){ el.classList.remove('dimmed'); el.classList.add('good'); }
    if(idx===k && k!==q.correct){ el.classList.remove('dimmed'); el.classList.add('bad'); }
  });
  const last = Q.i>=Q.list.length-1;
  let html='';
  if(Q.showFeedback){
    const streakHtml = (ok && Q.streak>=3) ? `<div style="text-align:center;margin:2px 0 10px;color:var(--good);font-family:Outfit;font-size:13px"><i class="ti ti-flame"></i> ${Q.streak} op rij goed</div>` : '';
    html = streakHtml + fbBlock(q, ok);
  }
  html += `<button class="pbtn" onclick="nextQ()">${last?(Q.mode==='exam'?'Bekijk uitslag':'Klaar'):'Volgende vraag'}</button>`;
  document.getElementById('fbslot').innerHTML = html;
  window.scrollTo({top:document.getElementById('fbslot').offsetTop-20,behavior:'smooth'});
}
function fbBlock(q, ok){
  const coachBtn = COACH_ENABLED ? `<button class="coachbtn" onclick="oefenCoach(this, ${JSON.stringify(q.vraag).replace(/"/g,'&quot;')}, ${JSON.stringify(q.uitleg).replace(/"/g,'&quot;')})"><i class="ti ti-microphone"></i> Laat je coach dit uitleggen</button>` : '';
  return `<div class="fb ${ok?'ok':'no'}">
    <div class="h"><i class="ti ti-${ok?'circle-check':'alert-circle'}"></i>${ok?'Goed gedaan':'Helaas, hier leer je van'}</div>
    <div>${esc(q.uitleg)}</div>
    ${q.examentip?`<div class="sub-h"><i class="ti ti-bulb"></i> Examentip</div><div>${esc(q.examentip)}</div>`:''}
    ${q.veelgemaakte_fout?`<div class="mistake"><div class="sub-h"><i class="ti ti-alert-triangle"></i> Veelgemaakte fout</div><div>${esc(q.veelgemaakte_fout)}</div></div>`:''}
    ${coachBtn}
  </div>`;
}
function nextQ(){
  if(coachConv) stopCoach();
  if(Q.i<Q.list.length-1){ Q.i++; Q.answered=false; quizStep(); window.scrollTo(0,0); }
  else { if(Q.onDone) Q.onDone({goed:Q.goed,total:Q.list.length,fout:Q.fout,list:Q.list}); else reset(home); }
}
