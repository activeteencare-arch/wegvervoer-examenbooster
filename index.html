function blokCoach(btn, opening){
  if(!COACH_ENABLED) return;
  if(coachConv){ stopCoach(); blokCoachUI(btn,'stopped'); return; }
  startCoach(opening, (state)=>blokCoachUI(btn, state));
}
function blokCoachUI(btn, state){
  if(!btn || !btn.isConnected) return;
  const active=(state==='listening'||state==='speaking'||state==='connecting');
  const m={ connecting:['Verbinden...','ti-loader-2'], listening:['Stop de uitleg','ti-player-stop'], speaking:['Stop de uitleg','ti-player-stop'], error:['Mislukt, tik opnieuw','ti-microphone'], stopped:['Laat je coach dit uitleggen','ti-microphone'] };
  const [txt,ic]=m[state]||['Laat je coach dit uitleggen','ti-microphone'];
  btn.innerHTML=`<i class="ti ${ic}"></i> ${txt}`;
  btn.style.borderColor=active?'var(--good)':''; btn.style.color=active?'var(--good)':'';
}
/* leer-scherm vóór een oefenblok: lezen, dan starten */
function blokLeren(key){
  const b=BLOKKEN_DEF.find(x=>x.key===key), ls=LEERSTOF[key], lijst=BLOKKEN[key];
  app.innerHTML = `
   <div class="chap-head"><div class="n">${String(BLOKKEN_DEF.indexOf(b)+1).padStart(2,'0')}</div><h2>${esc(ls.titel)}</h2></div>
   <p class="leadin">${esc(ls.intro)}</p>
   ${lsecHtml(ls)}
   ${blokCoachBtnHtml(ls)}
   <button class="pbtn" style="margin-top:6px" onclick="startBlokFromLeren('${key}')"><i class="ti ti-player-play"></i> Start de oefenvragen (${lijst.length})</button>
   <button class="pbtn ghost" style="margin-top:10px" onclick="goBack()">Terug</button>`;
}
/* vanuit het leer-scherm de quiz starten; resultaat keert netjes terug naar de blokkenlijst */
function startBlokFromLeren(key){
  const b=BLOKKEN_DEF.find(x=>x.key===key);
  startQuiz(BLOKKEN[key], b.titel, { mode:'oefen', shuffle:true, onDone:(r)=>{ SESSIE.blokken[key]=r; blokResult(key,r); } });
  stack[stack.length-1]=quizStep;
}
/* losse leerstof-ingang vanaf home: blok kiezen, dan lezen */
function leerstofLijst(){
  app.innerHTML = `<div class="sec-title"><span class="label">Leerstof</span><span class="cnt">4 blokken</span></div>
   <p class="muted" style="font-size:13.5px;line-height:1.6;margin:-4px 0 16px">De theorie van Wegvervoer Goederen Deel 1, opgedeeld in vier blokken. Lees een blok door en oefen daarna meteen, of duik direct in de oefenvragen.</p>` +
   BLOKKEN_DEF.map((b,i)=>{
     const ls=LEERSTOF[b.key]; const n=ls?(ls.secties||[]).length:0;
     return `<button class="row" onclick="go(()=>blokLezen('${b.key}'))">
       <span class="idx">${String(i+1).padStart(2,'0')}</span>
       <span class="ttl">${esc(b.titel)}<div class="meta">${n} onderdelen</div></span>
       <i class="ti ti-chevron-right chev"></i></button>`;
   }).join('') +
   `<button class="pbtn ghost" style="margin-top:8px" onclick="reset(home)">Terug naar start</button>`;
}
/* leesweergave vanuit de leerstof-ingang, met doorstap naar oefenen */
function blokLezen(key){
  const b=BLOKKEN_DEF.find(x=>x.key===key), ls=LEERSTOF[key], lijst=BLOKKEN[key];
  app.innerHTML = `
   <div class="chap-head"><div class="n">${String(BLOKKEN_DEF.indexOf(b)+1).padStart(2,'0')}</div><h2>${esc(ls.titel)}</h2></div>
   <p class="leadin">${esc(ls.intro)}</p>
   ${lsecHtml(ls)}
   ${blokCoachBtnHtml(ls)}
   <button class="pbtn" style="margin-top:6px" onclick="startBlokFromLeren('${key}')"><i class="ti ti-player-play"></i> Oefen dit blok (${lijst.length} vragen)</button>
   <button class="pbtn ghost" style="margin-top:10px" onclick="goBack()">Terug naar de blokken</button>`;
}
function startBlok(key){
  const b=BLOKKEN_DEF.find(x=>x.key===key);
  startQuiz(BLOKKEN[key], b.titel, { mode:'oefen', shuffle:true, onDone:(r)=>{ SESSIE.blokken[key]=r; blokResult(key,r); } });
  stack[stack.length-1]=quizStep;
}
function blokResult(key, r){
  go(()=>{
    const b=BLOKKEN_DEF.find(x=>x.key===key);
    const pct=Math.round(r.goed/r.total*100);
    app.innerHTML = `
     <div class="score"><div class="big"><b>${r.goed}</b> / ${r.total}</div>
       <div class="verdict ${pct>=70?'pass':'fail'}">${b.titel}</div>
       <div class="sub">${pct>=70?'Sterk blok. Dit zit goed.':'Nog wat aandacht waard. Loop de uitleg rustig na.'}</div></div>
     <button class="pbtn" onclick="reset(home);go(blokkenLijst)"><i class="ti ti-stack-2"></i> Volgend blok kiezen</button>
     <button class="pbtn ghost" style="margin-top:10px" onclick="reset(home)">Naar start</button>`;
  });
}

/* ====== mini-examen ====== */
function miniIntro(){
  app.innerHTML = `
   <div class="chap-head"><div class="n"><i class="ti ti-checklist"></i></div><h2>Mini-examen</h2>
     <div class="desc">${MINI.length} vragen in de stijl van het echte CBR-examen. Je ziet de uitslag en de uitleg pas aan het eind, net als op de examendag.</div></div>
   <div class="infonote"><i class="ti ti-target" style="color:var(--gold)"></i> Het echte examen heeft 30 vragen en je hebt er 20 goed nodig om te slagen. Dit mini-examen is je generale repetitie. Haal je hier 14 van de ${MINI.length}, dan zit je op koers.</div>
   <button class="pbtn" onclick="startMini()"><i class="ti ti-player-play"></i> Start het mini-examen</button>
   <button class="pbtn ghost" style="margin-top:10px" onclick="reset(home)">Terug naar start</button>`;
}
function startMini(){
  startQuiz(MINI, "Mini-examen", { mode:'exam', shuffle:true, onDone:(r)=>{ SESSIE.mini=r; miniResult(r); } });
  stack[stack.length-1]=quizStep;
}
function miniResult(r){
  reset(home);
  go(()=>{
    // schaal de 20/30-grens naar dit aantal vragen
    const drempel = Math.ceil(20/30*r.total);
    const pass = r.goed>=drempel;
    const perBlok = blokScores(r.list, r.fout);
    app.innerHTML = `
     <div class="score">
       <div class="big"><b>${r.goed}</b> / ${r.total}</div>
       <div class="verdict ${pass?'pass':'fail'}">${pass?'Op koers':'Nog niet op koers'}</div>
       <div class="sub">${pass
         ? `Mooi. Omgerekend naar de 20-van-30-grens zou dit ruim voldoende zijn. Loop hieronder na waar je nog punten liet liggen.`
         : `Je had er ${drempel} nodig om op koers te liggen voor de 20-van-30-grens. Nog ${drempel-r.goed} te gaan. Focus op de blokken hieronder.`}</div>
     </div>
     <div class="label" style="margin:6px 2px 12px">Score per blok</div>
     ${blokScoreList(perBlok)}
     <div class="advies">${nulAdvies(perBlok)}</div>
     ${r.fout.length?`<button class="pbtn ghost" onclick="toonFouten(${JSON.stringify(r.fout.map(q=>q.id)).replace(/"/g,'&quot;')})" style="margin-bottom:10px"><i class="ti ti-eye"></i> Bekijk de fout beantwoorde vragen</button>`:''}
     <button class="pbtn" onclick="reset(home);go(miniIntro)"><i class="ti ti-refresh"></i> Opnieuw</button>
     <button class="pbtn ghost" style="margin-top:10px" onclick="reset(home)">Naar start</button>`;
  });
}
function toonFouten(ids){
  const all = STARTCHECK.concat(...BLOKKEN_DEF.map(b=>BLOKKEN[b.key]), MINI);
  const lijst = ids.map(id=>all.find(q=>q.id===id)).filter(Boolean);
  go(()=>{
    app.innerHTML = `<div class="sec-title"><span class="label">Terugkijken</span><span class="cnt">${lijst.length} fout</span></div>` +
     lijst.map(q=>`<div class="card" style="padding:15px 16px;margin-bottom:12px">
       <div class="q-txt" style="font-size:15px;margin-bottom:12px">${esc(q.vraag)}</div>
       <div class="fb ok" style="margin:0">
         <div class="h"><i class="ti ti-circle-check"></i>${esc(q.opties[q.correct])}</div>
         <div>${esc(q.uitleg)}</div>
         ${q.examentip?`<div class="sub-h"><i class="ti ti-bulb"></i> Examentip</div><div>${esc(q.examentip)}</div>`:''}
       </div></div>`).join('') +
     `<button class="pbtn ghost" style="margin-top:6px" onclick="goBack()">Terug</button>`;
  });
}

/* ====== score-helpers ====== */
function blokScores(list, fout){
  const foutIds = new Set(fout.map(q=>q.id));
  const acc = {};
  BLOKKEN_DEF.forEach(b=>{ acc[b.key]={goed:0,total:0,titel:b.kort}; });
  list.forEach(q=>{
    const k = q.blok; if(!acc[k]) acc[k]={goed:0,total:0,titel:k};
    acc[k].total++; if(!foutIds.has(q.id)) acc[k].goed++;
  });
  return acc;
}
function blokScoreList(acc){
  return BLOKKEN_DEF.filter(b=>acc[b.key]&&acc[b.key].total).map(b=>{
    const s=acc[b.key], pct=Math.round(s.goed/s.total*100);
    const col = pct>=80?'var(--good)':pct>=50?'var(--gold)':'var(--bad)';
    return `<div class="blokrow"><span class="bn">${esc(b.kort)}</span>
      <span class="barwrap"><i style="width:${pct}%;background:${col}"></i></span>
      <span class="bs" style="color:${col}">${s.goed}/${s.total}</span></div>`;
  }).join('');
}
function nulAdvies(acc){
  const zwak = BLOKKEN_DEF.filter(b=>acc[b.key]&&acc[b.key].total).map(b=>{
    const s=acc[b.key]; return {titel:b.kort, key:b.key, pct:s.goed/s.total};
  }).sort((a,b)=>a.pct-b.pct);
  if(!zwak.length) return 'Maak eerst wat vragen, dan zie je hier een gericht advies.';
  const slecht = zwak.filter(z=>z.pct<0.7);
  if(!slecht.length) return '<b>Sterk over de hele linie.</b> Je staat er goed voor. Doe het mini-examen nog een keer op tijd, dan weet je zeker dat het blijft hangen.';
  const namen = slecht.slice(0,2).map(z=>z.titel).join(' en ');
  return `<b>Geef dit weekend voorrang aan ${namen}.</b> Daar liet je de meeste punten liggen. Oefen het bijbehorende blok nog een keer en laat je coach de lastige vragen uitleggen voor je het mini-examen opnieuw doet.`;
}

/* ====== ElevenLabs conversatiecoach (WebRTC, identiek aan rijschool) ====== */
let coachConv = null, coachUI = null;
function coach(){
  if(!COACH_ENABLED){ reset(home); return; }
  app.innerHTML = `
   <div class="card coach-card">
     <button id="coachMic" onclick="toggleCoach()" class="av" aria-label="Start of stop coach"><i class="ti ti-microphone"></i></button>
     <h2>Je examencoach</h2>
     <p id="coachStatus">Tik op de microfoon en stel je vraag, gewoon hardop.</p>
     <p class="dim" style="font-size:12px;margin-top:10px">De coach legt alleen uit wat in de gecontroleerde lesstof staat. Twijfelt hij, dan zegt hij dat eerlijk.</p>
   </div>
   <div class="card" style="padding:16px;margin-top:13px"><div class="label" style="margin-bottom:10px">Probeer bijvoorbeeld</div>
     ${['Leg het verschil uit tussen NIWO en KIWA','Wanneer geldt het CMR-verdrag en wanneer de AVC?','Hoe zit het met de pauze na 4,5 uur rijden?'].map(s=>`<div class="row" style="cursor:default;margin-bottom:8px"><i class="ti ti-message-2" style="color:var(--gold);font-size:16px"></i><span class="ttl" style="font-size:13.5px">${s}</span></div>`).join('')}</div>
   <button class="pbtn ghost" style="margin-top:14px" onclick="reset(home)">Terug naar start</button>`;
  coachUI = (state)=>setCoachUI(state);
  setCoachUI(coachConv?(coachConv._mode||'listening'):'idle');
}
function setCoachUI(state){
  const mic=document.getElementById('coachMic'), st=document.getElementById('coachStatus');
  if(!mic||!st) return;
  const m={
    idle:['Tik op de microfoon en stel je vraag, gewoon hardop.','ti-microphone','var(--gold)'],
    connecting:['Verbinden met je coach...','ti-loader-2','var(--gold)'],
    listening:['Ik luister, stel je vraag.','ti-microphone','var(--good)'],
    speaking:['Je coach legt uit...','ti-volume','var(--good)'],
    error:['Microfoon nodig, of verbinding mislukt. Tik om opnieuw te proberen.','ti-microphone','var(--bad)'],
    stopped:['Gesprek gestopt. Tik om opnieuw te starten.','ti-microphone','var(--gold)']
  };
  const [txt,ic,col]=m[state]||m.idle;
  st.textContent=txt; mic.querySelector('i').className='ti '+ic; mic.style.borderColor=col; mic.style.color=col;
}
async function startCoach(opening, ui){
  if(!COACH_ENABLED){ if(ui)ui('error'); return; }
  coachUI = ui; ui('connecting');
  try{
    const { Conversation } = await import('https://esm.sh/@elevenlabs/client');
    coachConv = await Conversation.startSession({
      agentId: COACH_AGENT_ID,
      connectionType:'webrtc',
      dynamicVariables:{ opening: opening },
      onModeChange:({mode})=>{ const s=(mode==='speaking')?'speaking':'listening'; if(coachConv)coachConv._mode=s; if(coachUI)coachUI(s); },
      onStatusChange:({status})=>{ if(status==='disconnected'){ coachConv=null; if(coachUI)coachUI('stopped'); } },
      onError:()=>{ coachConv=null; if(coachUI)coachUI('error'); }
    });
  }catch(e){ coachConv=null; if(coachUI)coachUI('error'); }
}
async function stopCoach(){
  if(coachConv){ try{ await coachConv.endSession(); }catch(e){} }
  coachConv=null; if(coachUI) coachUI('stopped');
}
function toggleCoach(){
  if(coachConv){ stopCoach(); return; }
  const opening = 'Hoi! Ik ben je examencoach voor Wegvervoer 1. Waar wil je het over hebben: de organisaties, de vervoersovereenkomst, de rij- en rusttijden, of de CEMT en grenzen?';
  startCoach(opening, (state)=>setCoachUI(state));
}
function oefenCoach(btn, vraag, uitleg){
  if(!COACH_ENABLED) return;
  if(coachConv){ stopCoach(); lesBtnUI(btn,'stopped'); return; }
  const opening = `${vraag} Het zit zo. ${uitleg} Leg eens in je eigen woorden uit waarom dit het juiste antwoord is.`;
  startCoach(opening, (state)=>lesBtnUI(btn, state));
}
function lesBtnUI(btn, state){
  if(!btn || !btn.isConnected) return;
  const active=(state==='listening'||state==='speaking'||state==='connecting');
  const m={ connecting:['Verbinden...','ti-loader-2'], listening:['Stop de uitleg','ti-player-stop'], speaking:['Stop de uitleg','ti-player-stop'], error:['Mislukt, tik opnieuw','ti-microphone'], stopped:['Laat je coach dit uitleggen','ti-microphone'] };
  const [txt,ic]=m[state]||['Laat je coach dit uitleggen','ti-microphone'];
  btn.innerHTML=`<i class="ti ${ic}"></i> ${txt}`;
  btn.style.borderColor=active?'var(--good)':''; btn.style.color=active?'var(--good)':'';
}
